    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #ar-container {
            margin: 20px 0;
        }
        .ar-button {
            background-color: #ffffff;
            color: #fff;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .ar-button:hover {
            background-color: #ffffff;
        }
        .ar-icon {
            display: block;
            margin: 10px auto;
            width: 50px;
            height: auto;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Detect iOS devices
            const isIOS = /iPhone|iPad/i.test(navigator.userAgent);

            // Show AR container only on iOS devices
            const arContainers = document.querySelectorAll(".ar-container");
            if (isIOS) {
                arContainers.forEach(container => {
                    container.style.display = "block"; // Show AR button on iOS
                });
            }
        });
    </script>
