<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDZ Object Viewer and AR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #ar-container {
            margin: 20px 0;
        }
        .ar-button {
            background-color: #ffffff;
            color: #fff;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .ar-button:hover {
            background-color: #ffffff;
        }
        .ar-icon {
            display: block;
            margin: 10px auto;
            width: 50px;
            height: auto;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Detect iOS devices
            const isIOS = /iPhone|iPad/i.test(navigator.userAgent);

            // Show AR container only on iOS devices
            const arContainers = document.querySelectorAll(".ar-container");
            if (isIOS) {
                arContainers.forEach(container => {
                    container.style.display = "block"; // Show AR button on iOS
                });
            }
        });
    </script>
</head>
<body>
    <h2>Open 3D Model in AR</h2>

    <!-- AR Buttons (9 copies) -->
    <div id="ar-container" class="ar-container" style="display: none;">
        <a href="https://u1.padletusercontent.com/uploads/padlet-uploads/3146059390/5b8a7ed838a9d0dd901b9e49ebf161a6/AR_isovibe_25_v.usdz" 
           rel="ar" 
           class="ar-button">
           <img src="Img/picldpi[1].png" alt="AR Icon" class="ar-icon">
        </a>
    </div>


</body>
