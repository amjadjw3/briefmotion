<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDZ Object Viewer and AR</title>
    <style>
        section h1 {
        background-color: #333; /* لون الخلفية */
        color: white; /* لون النص */
        padding: 15px; /* مساحة داخلية حول النص */
        border-radius: 5px; /* زوايا مستديرة */
        text-align: left; /* محاذاة النص إلى اليسار */
        font-size: 24px; /* حجم الخط */
        font-weight: bold; /* جعل النص عريضاً */

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
        section {
            margin: 20px;
            padding: 20px;
            background-color: #f2f2f2;
            border-radius: 8px;
        }
        section h1 {
            background-color: #4CAF50; /* لون خلفية مميز للعناوين */
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        section h2 {
            background-color: #d3d3d3;
            color: black;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .ar-container {
            margin: 20px 0;
            text-align: center;
            display: none; /* Default hidden; will show on iOS */
        }
        .ar-button {
            background-color: #ffffff;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .ar-icon {
            display: block;
            margin: 10px auto;
            width: 50px;
            height: auto;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const isIOS = /iPhone|iPad/i.test(navigator.userAgent);
            const arContainers = document.querySelectorAll(".ar-container");
            if (isIOS) {
                arContainers.forEach(container => {
                    container.style.display = "block";
                });
            }
        });
    </script>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>AR Viewer and 3D Models</h1>
        <img src="Img/web 50ldpi.jpg" alt="Header Image">
    </header>
</body>

<body>
    <!-- ORack AR Section -->
    <section>
        <h1>ORack AR</h1> <!-- العنوان المميز -->
        <h2>ORack AR Viewer</h2>
        <div class="ar-container">
            <a href="https://example.com/orack.usdz" rel="ar" class="ar-button">
                <img src="Img/picldpi[1].png" alt="AR Icon" class="ar-icon">
            </a>
        </div>
    </section>
</body>
