<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDZ Object Viewer and AR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        header img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }
        section {
            margin: 20px;
            padding: 20px;
            background-color: #f2f2f2;
            border-radius: 8px;
        }
        section h2 {
            background-color: #d3d3d3;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .ar-container {
            margin: 20px 0;
            text-align: center;
            display: none; /* Default hidden; will show on iOS */
        }
        .ar-button {
            background-color: #ffffff;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .ar-icon {
            display: block;
            margin: 10px auto;
            width: 50px;
            height: auto;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const isIOS = /iPhone|iPad/i.test(navigator.userAgent);
            const arContainers = document.querySelectorAll(".ar-container");
            if (isIOS) {
                arContainers.forEach(container => {
                    container.style.display = "block";
                });
            }
        });
    </script>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>AR Viewer and 3D Models</h1>
        <img src="your-header-image.jpg" alt="Header Image">
    </header>

    <!-- ORack AR Section -->
    <section>
        <h2>ORack AR</h2>
        <div class="ar-container">
            <a href="https://example.com/orack.usdz" rel="ar" class="ar-button">
                <img src="Img/picldpi[1].png" alt="AR Icon" class="ar-icon">
            </a>
        </div>
    </section>

    <!-- Drive in AR Section -->
    <section>
        <h2>Drive in AR</h2>
        <div class="ar-container">
            <a href="https://example.com/drive.usdz" rel="ar" class="ar-button">
                <img src="Img/picldpi[1].png" alt="AR Icon" class="ar-icon">
            </a>
        </div>
    </section>

    <!-- Front Zone AR Section -->
    <section>
        <h2>Front Zone AR</h2>
        <div class="ar-container">
            <a href="https://example.com/frontzone.usdz" rel="ar" class="ar-button">
                <img src="Img/picldpi[1].png" alt="AR Icon" class="ar-icon">
            </a>
        </div>
    </section>

    <!-- Add more sections as needed -->

</body>
</html>
